[tool.poetry]
name = "metin-bot"
version = "2.0.0"
description = "Automated Metin2 stone farming bot with computer vision"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
keyboard = "^0.13.5"
pyautogui = "^0.9.54"
pydirectinput = "^1.0.4"
pywin32 = {version = ">=307", markers = "sys_platform == 'win32'"}
pillow = "^10.4.0"
opencv-python = "^4.10.0"
screeninfo = "^0.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"
flake8 = "^7.1.1"

[tool.poetry.scripts]
metin-bot = "src.main:main"
metin-bot-mining = "src.main:main_mining"
metin-bot-dungeon = "src.main:main_dungeon"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | debug
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--verbose"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
